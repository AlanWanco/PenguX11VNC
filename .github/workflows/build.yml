name: Build debug bundles

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.14.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Install headless browser
        run: npx playwright install --with-deps chrome
      - name: Run browser tests
        run: npm run test:browser
      - name: Run Python tests and lint
        run: |
          python3 -m unittest discover -s test -p 'test_remote_session.py'
          python3 -m pip install --disable-pip-version-check --user --break-system-packages ruff
          "$HOME/.local/bin/ruff" check tools/ test/test_remote_session.py
      - name: Check Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy
      - name: Run Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

  build-native:
    name: Build ${{ matrix.id }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            node_platform: darwin
            node_arch: arm64
            bundle: dmg
            bundle_dir: dmg
          - id: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            node_platform: linux
            node_arch: x64
            bundle: appimage
            bundle_dir: appimage
          - id: windows-amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            node_platform: win32
            node_arch: x64
            bundle: nsis
            bundle_dir: nsis
          - id: windows-arm64
            runner: windows-2022
            target: aarch64-pc-windows-msvc
            node_platform: win32
            node_arch: arm64
            bundle: nsis
            bundle_dir: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set artifact identity
        id: metadata
        shell: bash
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Stage target Node.js runtime
        shell: bash
        run: |
          python tools/stage-node-runtime.py \
            --version "$NODE_VERSION" \
            --platform "${{ matrix.node_platform }}" \
            --arch "${{ matrix.node_arch }}"
      - name: Build one installer bundle
        shell: bash
        run: |
          if [[ "${{ matrix.id }}" == "macos-arm64" ]]; then
            # GitHub-hosted macOS runners have no Finder session. Avoid
            # Tauri's create-dmg AppleScript step and create a headless DMG.
            npm run tauri:build -- \
              --target "${{ matrix.target }}" \
              --bundles app
            app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/PenguX11VNC.app"
            dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
            mkdir -p "$dmg_dir"
            hdiutil create \
              -volname "PenguX11VNC" \
              -srcfolder "$app_path" \
              -ov \
              -format UDZO \
              "$dmg_dir/PenguX11VNC_ci.dmg"
          else
            npm run tauri:build -- \
              --target "${{ matrix.target }}" \
              --bundles "${{ matrix.bundle }}"
          fi
      - name: Normalize artifact name
        shell: bash
        run: |
          python tools/collect-bundle.py \
            --bundle-root "src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle_dir }}" \
            --bundle "${{ matrix.bundle }}" \
            --name "PenguX11VNC-${{ matrix.id }}-${{ steps.metadata.outputs.short_sha }}"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import hashlib
          path = next(Path("dist").iterdir())
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f"### {path.name}")
          print(f"- Target: `${{ matrix.target }}`")
          print(f"- Runner: `${{ matrix.runner }}`")
          print(f"- SHA-256: `{digest}`")
          print("- Download: this job's `PenguX11VNC-${{ matrix.id }}-${{ steps.metadata.outputs.short_sha }}` artifact")
          print("- Unsigned debug bundle; install/use only on a trusted test machine.")
          PY
      - name: Upload one debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguX11VNC-${{ matrix.id }}-${{ steps.metadata.outputs.short_sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-linux-arm64:
    name: Build linux-arm64 (QEMU)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set artifact identity
        id: metadata
        shell: bash
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build inside an ARM64 userspace
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          docker run --rm --platform linux/arm64 \
            -e NODE_VERSION="$NODE_VERSION" \
            -e SHORT_SHA="${{ steps.metadata.outputs.short_sha }}" \
            -v "$WORKSPACE:/workspace" \
            -w /workspace \
            ubuntu:24.04 \
            bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential ca-certificates curl file git python3 xz-utils \
                libayatana-appindicator3-dev libgtk-3-dev libssl-dev \
                libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
              node_archive="node-v${NODE_VERSION}-linux-arm64.tar.xz"
              node_url="https://nodejs.org/dist/v${NODE_VERSION}/${node_archive}"
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o /tmp/SHASUMS256.txt
              expected="$(awk -v name="$node_archive" "(\$2 == name) { print \$1 }" /tmp/SHASUMS256.txt)"
              test -n "$expected"
              curl -fsSL "$node_url" -o "/tmp/$node_archive"
              printf "%s  %s\\n" "$expected" "/tmp/$node_archive" | sha256sum -c -
              tar -xJf "/tmp/$node_archive" -C /opt
              mv "/opt/node-v${NODE_VERSION}-linux-arm64" /opt/node
              export PATH="/opt/node/bin:$PATH"
              node --version
              npm --version
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              rustup target add aarch64-unknown-linux-gnu
              npm ci
              python3 tools/stage-node-runtime.py --version "$NODE_VERSION" --platform linux --arch arm64
              npm run tauri:build -- --target aarch64-unknown-linux-gnu --bundles appimage
              python3 tools/collect-bundle.py \
                --bundle-root src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage \
                --bundle appimage \
                --name "PenguX11VNC-linux-arm64-${SHORT_SHA}"
            '
      - name: Write build summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import hashlib
          path = next(Path("dist").iterdir())
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f"### {path.name}")
          print("- Target: `aarch64-unknown-linux-gnu`")
          print("- Build userspace: `linux/arm64` under QEMU")
          print(f"- SHA-256: `{digest}`")
          print("- Download: this job's `PenguX11VNC-linux-arm64-${{ steps.metadata.outputs.short_sha }}` artifact")
          print("- Unsigned debug bundle; install/use only on a trusted test machine.")
          PY
      - name: Upload one debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguX11VNC-linux-arm64-${{ steps.metadata.outputs.short_sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
