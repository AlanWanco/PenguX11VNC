# PenguX11VNC application commands used by the main webview.

[[permission]]
identifier = "allow-set-main-window-aspect"
description = "允许主窗口设置和清除 VNC 内容比例约束。"
commands.allow = ["set_main_window_aspect"]

[[permission]]
identifier = "allow-set-macos-remote-shortcuts"
description = "允许仅在远端画布聚焦时切换 macOS 远端快捷键菜单。"
commands.allow = ["set_macos_remote_shortcuts"]

[[permission]]
identifier = "allow-read-clipboard-text"
description = "允许在用户启用剪贴板同步或主动粘贴时读取本机文字剪贴板。"
commands.allow = ["read_clipboard_text"]

[[permission]]
identifier = "allow-write-clipboard-text"
description = "允许在用户启用剪贴板同步时写入本机文字剪贴板。"
commands.allow = ["write_clipboard_text"]

[[permission]]
identifier = "allow-read-clipboard-files"
description = "允许读取用户主动选择的本机文件剪贴板预览。"
commands.allow = ["read_clipboard_files"]

[[permission]]
identifier = "allow-upload-clipboard-files"
description = "允许将用户确认的文件通过 SSH 上传并写入远端文件剪贴板。"
commands.allow = ["upload_clipboard_files"]

[[permission]]
identifier = "allow-inspect-files"
description = "允许预览用户拖放到应用窗口的普通文件。"
commands.allow = ["inspect_files"]

[[permission]]
identifier = "allow-upload-files"
description = "允许将用户确认的拖放文件通过 SSH 上传并写入远端文件剪贴板。"
commands.allow = ["upload_files"]
