[package]
name = "pengux11vnc"
version = "0.1.0"
description = "PenguX11VNC desktop client"
authors = ["PenguX11VNC contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pengux11vnc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }
url = "2"
rand = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
