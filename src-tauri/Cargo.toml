[package]
name = "pengux11vnc"
version = "0.1.0"
description = "PenguX11VNC desktop client"
authors = ["PenguX11VNC contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pengux11vnc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
url = "2"
rand = "0.9"
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
